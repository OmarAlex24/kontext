# Scenario "long-memory": four working days on the same billing project, with
# facts the user states only once in the conversation, lots of filler that
# fills the window, compactions and new sessions. It measures whether the agent
# remembers (and applies) what was said in passing after all that.
# Format: bench/README.md.
#
# Fact classes:
# - A: the charter and the decisions, recorded before day 1 (baseline).
# - B: facts said in passing on day 1, mixed with normal work; they are not in
#   the charter or in the repo.
# - C: two of the B facts that change on day 2; the one in force counts.
# - Distractors: almost identical sentences planted in the filler.
#
# Checkpoints: 1 = day 1 after compacting; 2 = day 2, new session;
# 3 = day 3, new session, after the changes and another compaction;
# 4 = day 4, after the code tasks that depend on the facts.

name = "long-memory"
description = "Billing with late fees: facts said in passing, ~100k tokens of filler per session (~140k window), /compact and new sessions"

[bench]
# Turns on kontext's distill (PreCompact and SessionEnd hooks) in the kontext-*
# variants. The harness waits for it to finish before each turn and adds its cost.
distill = true

[charter]
title = "Collect on time with reminders and late fees"
objective = "Overdue customers get a reminder by email, and the late fee is calculated correctly"
non_goals = ["Sending SMS or WhatsApp messages", "Changing how invoices are issued"]
done_when = "The acceptance tests pass"

[[goals]]
id = "reminders"
title = "Email reminders to customers with overdue invoices"
done_when = "One email per customer, only when due and at the right time"
scope = [
  "src/billing/reminders.py", "src/billing/sending.py", "src/billing/mail.py",
  "src/billing/invoices.py", "tests/test_reminders.py", "tests/test_sending.py", "tests/test_invoices.py",
]

[[goals]]
id = "late-fees"
title = "Late fees and portfolio status"
done_when = "The late fee on an overdue invoice uses the rate in force"
scope = [
  "src/billing/fees.py", "src/billing/portfolio.py", "src/billing/amounts.py",
  "tests/test_fees.py", "tests/test_portfolio.py", "tests/test_amounts.py",
]

[scope]
ignore = ["CLAUDE.md", "AGENTS.md", ".kontext.toml", ".claude/**", "**/__pycache__/**", "**/*.pyc", ".bench/**"]

[[decisions]]
id = "postmark"
title = "Send emails with Postmark (billing.mail.Postmark), never with smtplib"
why = "A home-made SMTP server lands in spam; Postmark already has the domain verified"
guard = "! grep -rqi smtplib src/"

[[decisions]]
id = "cents"
title = "Amounts are stored in cents, as integers; never float"
why = "With float the balances don't add up when partial payments are summed"
guard = "! grep -rnE 'float\\(' src/"

[acceptance]
# The behavior tests: they depend on the B and C facts. They are copied to
# tests/ at the end; the agent doesn't see them.
files = "acceptance"
# Only the behavior ones, not the ones the agent wrote.
command = "PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_behavior.py' -v"
label = "Behavior %"

