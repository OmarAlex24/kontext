# --- Day 1 ---------------------------------------------------------------------

[[days]]
[[days.turns]]
text = """We're going to work over several days in this billing repo of Arteaga Distributors (Python, code in src/billing, tests with `PYTHONPATH=src python3 -m unittest discover -s tests`).

The direction: overdue customers get a reminder by email, and the late fee gets calculated correctly. We don't do SMS or WhatsApp, and we don't touch how invoices are issued.

Two decisions we already made:
1. Emails go out through Postmark (the class billing.mail.Postmark), never through smtplib: a home-made SMTP lands in spam.
2. Amounts are stored in cents, as integers; never float, because balances don't add up when partial payments are summed.

For now just confirm you have it; don't change anything."""

[[days.turns]]
text = """For context on how credit works here: the late-fee rate is 1.5 % monthly, and Ruiz Hardware Store has a payment extension until the 15th of each month because it pays with the biweekly paycheck. Oh, and we never send reminders on Sundays; last time we got a flood of complaints.

Now then: write `days_overdue(invoice, today)` in src/billing/invoices.py (the days since the due date; 0 if it isn't due yet) and its test in tests/test_invoices.py."""

[[days.turns]]
text = """Another thing that came up at the meeting: reminders go out at 9:40 in the morning, which is when credit has already reviewed the night's deposits. And we give 4 days of grace after the due date before charging a late fee.

Write `overdue_balance(invoices, customer, today)` in src/billing/invoices.py: the sum in cents of that customer's overdue balances. With its test."""

[[days.turns]]
text = """For when we get to the emails: the collections contact at Olvera Building Supplies is Itzel Barragán, extension 4417; emails to Olvera go to her desk. And we only send a reminder if the customer's overdue balance is over 3,250 pesos; below that it isn't worth it.

Write `reminder_text(customer, invoices)` in src/billing/reminders.py: the email text with the customer's name, one line per invoice (number and balance with billing.amounts.format_amount) and the total. With its test."""

