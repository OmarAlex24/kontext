[[fake.rules.write]]
path = "src/billing/portfolio.py"
mode = "append"
content = '''

def account_statement(customer, invoices, today):
    from billing.amounts import format_amount

    fs = [f for f in invoices if f.customer == customer]
    lines = [f"{f.number} {f.due} {format_amount(f.balance_cents)}" + (" overdue" if f.due < today else "") for f in fs]
    lines.append(f"Total: {format_amount(sum(f.balance_cents for f in fs))}")
    return "\n".join(lines)
'''

