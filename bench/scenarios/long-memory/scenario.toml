def send_reminders(invoices, today, mail, addresses):
    from billing.invoices import by_customer, overdue

    n = 0
    for customer, fs in by_customer(overdue(invoices, today)).items():
        mail.send(addresses[customer], "Overdue invoices", reminder_text(customer, fs))
        n += 1
    return n
'''

