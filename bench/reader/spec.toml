# ------------------------------------------------------------------ questions
#
# The `value` task. `expected` and `forbidden` use the scenarios' syntax:
# whole words, case and accents ignored, `a|b` accepts either form. `forbidden`
# carries every superseded value of the idea (one may be stale in items.md)
# and the value of its close distractor; the generator checks both.
#
#   q1  changed twice, the last dump wins       15 -> 30 -> 20, distractor 10
#   q2  changed relatively ("twice as many")    12 -> 24, distractor 25
#   q3  changed relatively ("one hour earlier") 8 pm -> 7 pm, distractor 9 pm
#   q4  said in passing                          48 hours, distractor 72
#   q5  said in passing, as a plain limit        three, distractor five
#   q6  said in passing, as a plain fact         Mondays, distractor Sundays
#
# q1-q3 are changed ideas: in every fixture at least one of them is listed in
# items.md with a superseded value (which ones is up to the seed).

[[questions]]
id = "q1"
idea = "pickup-slots"
question = "How long is one pickup slot?"
expected = ["20"]
forbidden = ["15", "30", "10"]

[[questions]]
id = "q2"
idea = "order-history"
question = "How many orders does one page of the order history show?"
expected = ["24"]
forbidden = ["12", "25"]

[[questions]]
id = "q3"
idea = "preorder-cutoff"
question = "Until what time can customers pre-order for the next morning?"
expected = ["7 pm|7pm|7:00 pm|7 p.m.|19:00|19h"]
forbidden = ["8 pm|8pm|8:00 pm|8 p.m.|20:00|20h", "9 pm|9pm|9:00 pm|9 p.m.|21:00|21h"]

[[questions]]
id = "q4"
idea = "cake-notice"
question = "How much notice does a custom cake order need?"
expected = ["48|two days|2 days"]
forbidden = ["72|three days|3 days"]

[[questions]]
id = "q5"
