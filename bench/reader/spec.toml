# The reader benchmark's fixture: a fictional greenfield app, the ideas the user
# says about it in three brain-dumps, and the questions about its values.
# `benchlib/pmfixture.py` turns this, a size and a seed into a `.pm/` folder and
# its ground truth. See bench/README.md, "Reader benchmark".
#
# Every sentence below appears word for word in the dumps (the generator checks
# it). Use single spaces and no line breaks inside a sentence.

name = "bakery"
app = "Crumb, the ordering app for Rosa's neighborhood bakery"
# Fixed dates: nothing in the fixture depends on the day it is generated.
updated = "2026-10-19"

# Lines the user writes before pasting something; the seed picks them.
paste_intros = [
  "Pasting this here so I don't lose it:",
  "Copying the thread from my day job, I need to get back to it later:",
  "Dumping these notes here for now:",
  "(pasted from my notes app)",
  "Saving this for later, ignore it for the app:",
]
# How many of the distractors without `always` each fixture carries (below).
optional_count = 3

# ------------------------------------------------------------------ ideas
#
# kind:
#   clear      stated plainly in a paragraph of its own;
#   changed    stated plainly, and its value changes in a later dump (`change`);
#   passing    said in passing in the middle of a paragraph about something else;
#   discarded  stated, and explicitly dropped in a later dump (`discard`).
#
# `items` are the paraphrases `items.md` uses (one is picked by the seed); a
# changed idea has `items_old` (the stale value) and `items_new`. `value` and
# `value_new` are only used by bench/fake_reader.py to answer the questions.

[[ideas]]
id = "preorder-cutoff"
kind = "clear"
said = "Customers should be able to pre-order bread until 8 pm the night before."
items = ["Next-day pre-orders close at 8 pm.", "Pre-ordering for tomorrow stays open until 8 pm the evening before."]
value = "8 pm"

[[ideas]]
id = "pickup-slots"
kind = "changed"
said = "Pickup slots should be 15 minutes long so the counter never gets crowded."
change = "Thinking about it more, the pickup slots should be 30 minutes long instead of 15, because people are always late."
items_old = ["Pickup is booked in 15-minute windows.", "Customers choose a 15-minute pickup window."]
items_new = ["Pickup is booked in 30-minute windows.", "Customers choose a 30-minute pickup window."]
value = "15 minutes"
value_new = "30 minutes"

[[ideas]]
id = "order-history"
kind = "changed"
said = "The order history should show 20 orders per page."
change = "Let's show 50 orders per page in the order history instead of 20, scrolling is fine on a phone."
items_old = ["Order history is paginated at 20 orders a page.", "Past orders list: 20 per page."]
items_new = ["Order history is paginated at 50 orders a page.", "Past orders list: 50 per page."]
value = "20"
value_new = "50"

[[ideas]]
id = "allergen-tags"
kind = "clear"
said = "Every product needs allergen tags for gluten, nuts, dairy and eggs."
items = ["Allergen labels on each product (gluten, nuts, dairy, eggs).", "Products carry allergen info: gluten, nuts, dairy and eggs."]

[[ideas]]
id = "loyalty-card"
kind = "clear"
said = "I want a stamp card where every tenth loaf of bread is free."
items = ["Loyalty stamps: the 10th loaf is on the house.", "Stamp card with one free loaf after nine paid ones."]

[[ideas]]
id = "sold-out-badge"
kind = "clear"
said = "When a product sells out, the app should show a sold-out badge instead of hiding it."
items = ["Sold-out products stay visible with a badge.", "Show a 'sold out' label on finished products rather than removing them."]

[[ideas]]
id = "wholesale-invoices"
kind = "clear"
said = "Cafés that buy wholesale should get one invoice at the end of the month instead of paying per order."
items = ["Monthly invoicing for the wholesale café customers.", "Wholesale accounts settle one invoice per month."]

[[ideas]]
id = "ready-push"
kind = "clear"
said = "The app should send a push notification when the order is ready to pick up."
items = ["Push notification when an order is ready.", "Notify the customer by push once the order can be collected."]

[[ideas]]
id = "cake-notice"
kind = "passing"
said = "Custom cake orders need 48 hours of notice."
items = ["Custom cakes require two days of notice (48 h).", "48-hour lead time on custom cake orders."]
value = "48 hours"

[[ideas]]
id = "favorite-reorder"
kind = "passing"
said = "It would be nice if regulars could save a favorite order and repeat it with one tap."
items = ["One-tap reorder of a saved favorite order.", "Regulars can save a favorite order and repeat it."]

[[ideas]]
id = "dark-mode"
kind = "discarded"
said = "I'd like a dark mode for the app, it looks good at night."
discard = "Forget the dark mode, nobody orders croissants at midnight."
items = ["Dark mode for the app.", "Dark theme option."]

[[ideas]]
id = "home-delivery"
kind = "discarded"
said = "We could offer home delivery for orders within 2 km of the bakery."
discard = "Let's drop home delivery for good: the bakery has no driver, so it is pickup only."
items = ["Home delivery within 2 km.", "Delivery to homes near the bakery (2 km radius)."]

# ------------------------------------------------------------------ dumps
#
# The user's own paragraphs, one dump per date. `{said:<id>}`, `{change:<id>}`
# and `{discard:<id>}` are replaced by the idea's sentence; each one has to be
# used exactly once. The first paragraph of each dump stays first; the seed
# shuffles the rest and drops the pasted material between them.

[[dumps]]
date = "2026-10-05"
paragraphs = [
  "OK, first brain-dump about Crumb, the app for Rosa's bakery. Rosa is tired of taking orders over the phone and on scraps of paper, so the idea is a small app where people order ahead and just pick up.",
  "The most important thing for Rosa is knowing how much to bake. {said:preorder-cutoff} After that she closes the list and starts the dough.",
  "For the pickup itself I am thinking of time slots. {said:pickup-slots} The customer picks a slot when ordering and gets a reminder.",
  "Product pages should be simple, a photo, the price and what is inside. {said:allergen-tags} Rosa says half her questions at the counter are about allergies.",
  "Regulars matter a lot here. {said:loyalty-card} Rosa already does it on paper cards and people love it.",
  "{said:sold-out-badge} People like to see what they missed, and Rosa thinks it makes them come earlier the next day.",
  "{said:wholesale-invoices} There are three cafés on the street that buy croissants every morning, and paying each order separately is a pain for them.",
  "For the account screen: {said:order-history} Nobody needs more than that on a phone.",
  "Some extras that came to mind on the bus. {said:dark-mode} {said:home-delivery} Not sure about either, let's see.",
]

[[dumps]]
date = "2026-10-12"
paragraphs = [
  "Second dump, after a week of talking with Rosa and watching the counter on Saturday morning.",
  "{change:pickup-slots} On Saturday half of the 9 am customers showed up at 9:20.",
  "The oven technician came on Tuesday and we moved the second batch to 7:30. {said:cake-notice} He also said the proofing cabinet needs a new seal before winter, which Rosa will have to budget for.",
  "{discard:dark-mode} Rosa opens at 6 am and closes at 7 pm, the app does not need it.",
  "{said:ready-push} The counter gets busy and people stand around waiting otherwise.",
]

[[dumps]]
date = "2026-10-19"
paragraphs = [
  "Third dump. Short one, mostly corrections and the photo session.",
  "{change:order-history} The wholesale cafés have long histories and they want to see the whole month.",
  "{discard:home-delivery} We can revisit it if she ever hires someone.",
  "The photographer can come on Thursday for the product photos, and she needs the list of breads by Wednesday. {said:favorite-reorder} She charges per photo, so we should keep the list short and skip the seasonal stuff.",
]

# ------------------------------------------------------------------ distractors
#
# Near-identical ideas of someone else or of another project, planted inside the
# pasted material (benchlib/fill.py's carriers). `always` ones are in every
# fixture (the value questions rely on them); the seed picks `optional_count`
# (at the top) of the others. Written without a final period: the carrier adds
# its own.

[[distractors]]
id = "pizzeria-slots"
near = "pickup-slots"
text = "Luis's pizzeria app books pickups in 10-minute slots"
always = true

[[distractors]]
id = "bookstore-history"
near = "order-history"
text = "Marta's bookstore app shows 25 orders per page in its order history"
always = true

[[distractors]]
id = "cafe-preorders"
near = "preorder-cutoff"
text = "the café next door takes pre-orders until 9 pm the night before"
always = true

[[distractors]]
id = "riverside-cakes"
near = "cake-notice"
text = "the Riverside bakery asks for 72 hours of notice on custom cakes"
always = true

[[distractors]]
id = "cafe-pdf"
text = "the café next door's app exports every receipt as a PDF"

[[distractors]]
id = "clinic-sms"
near = "ready-push"
text = "Ana's clinic project wants SMS reminders the day before each appointment"

[[distractors]]
id = "cafe-stamps"
near = "loyalty-card"
text = "the café next door gives a free coffee after eight stamps on its loyalty card"

[[distractors]]
id = "gym-dark-mode"
near = "dark-mode"
text = "the gym's booking app added a dark mode last month and the members love it"

[[distractors]]
id = "canteen-allergens"
near = "allergen-tags"
text = "the school canteen project tags every dish with its allergens"

# ------------------------------------------------------------------ questions
#
# The `value` task. `expected` and `forbidden` use the scenarios' syntax:
# whole words, case and accents ignored, `a|b` accepts either form. `forbidden`
# is the old value of a changed idea (stale in items.md) or a close distractor.

[[questions]]
id = "q1"
idea = "pickup-slots"
question = "How long is one pickup slot?"
expected = ["30"]
forbidden = ["15", "10"]

[[questions]]
id = "q2"
idea = "order-history"
question = "How many orders does one page of the order history show?"
expected = ["50"]
forbidden = ["20", "25"]

[[questions]]
id = "q3"
idea = "preorder-cutoff"
question = "Until what time can customers pre-order for the next morning?"
expected = ["8 pm|8pm|8:00 pm|8 p.m.|20:00|20h"]
forbidden = ["9 pm|9pm|9:00 pm|9 p.m.|21:00|21h"]

[[questions]]
id = "q4"
idea = "cake-notice"
question = "How much notice does a custom cake order need?"
expected = ["48|two days|2 days"]
forbidden = ["72|three days|3 days"]
