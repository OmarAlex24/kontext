# The confusion probes in test_confusions.py. A probe passes only when the code
# behaves with that exact wrong value; a failed requirement whose probe passes
# is reported as a confusion. `kind` is "old" (a value the user replaced or
# discarded) or "distractor" (a value from the pottery studio's email).

