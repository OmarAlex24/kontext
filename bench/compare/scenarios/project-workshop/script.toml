Hi, I'm on the computer at the front desk today. Please implement `book()` and `price_for()` in workshop/bookings.py, with the member rules."""

[[days.turns]]
kind = "work"
text = """
Now please implement `export_csv()` in workshop/export.py, for the accountant."""

[[days.turns]]
