machine = "A"

[[days.turns]]
kind = "work"
text = """
Hi again, it's a new day. Please implement `cancel()` and `refund_amount()` in workshop/bookings.py, with the rule we agreed."""

[[days.turns]]
kind = "work"
text = """
Now please implement `reminders_due()` in workshop/notify.py."""

[[days.turns]]
kind = "work"
text = """
Now please implement `join_waitlist()` and `promote_waitlist()` in workshop/bookings.py."""

