[package]
name = "kontext"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Project memory for coding agents: an append-only ledger, one chain per writer"
license = "MIT"
publish = false

[[bin]]
name = "kontext"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.39", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
libc = "0.2.191"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "2"
toml = "1.1.8"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3.27.0"
