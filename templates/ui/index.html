<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>kontext</title>
<style>
/*KONTEXT_STYLE*/
</style>
</head>
<body>
<a class="skip" href="#ledger">Skip to the ledger</a>
<header class="top">
  <div class="top-title">
    <h1 id="project">kontext</h1>
    <p class="tagline">One ledger, one view for each reader · <a href="/report">Where we are</a></p>
  </div>
  <ul class="chips" id="chips" aria-label="Ledger status"></ul>
</header>
<main class="layout">
  <section class="ledger-wrap" aria-labelledby="ledger-title">
    <div class="section-head">
      <h2 id="ledger-title">Ledger</h2>
      <p class="muted" id="ledger-count"></p>
    </div>
    <ul class="legend" id="legend" aria-label="Entry kinds"></ul>
    <div class="ledger" id="ledger" tabindex="-1">
      <table>
        <thead>
          <tr>
            <th scope="col" class="c-n">#</th>
            <th scope="col" class="c-hash">Fingerprint</th>
            <th scope="col" class="c-kind">Kind</th>
            <th scope="col" class="c-entry">Entry</th>
            <th scope="col" class="c-actor">Wrote</th>
            <th scope="col" class="c-gutter"><span class="sr">What is new for each reader</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="more"><button type="button" id="more" hidden>See earlier entries</button></div>
  </section>
  <aside class="side">
    <section aria-labelledby="readers-title">
      <h2 id="readers-title">Readers</h2>
      <div id="readers"></div>
    </section>
    <section aria-labelledby="alerts-title">
      <h2 id="alerts-title">Alerts</h2>
      <div id="alerts"></div>
    </section>
    <section aria-labelledby="charter-title">
      <h2 id="charter-title">Charter</h2>
      <div id="charter"></div>
    </section>
  </aside>
  <section class="boards" aria-labelledby="boards-title">
    <h2 id="boards-title">Epics</h2>
    <div id="boards"></div>
  </section>
</main>
<footer class="foot">
  <p id="live" role="status">Reading the ledger…</p>
  <p class="muted">Read-only: to write, use <span class="cmd">kontext</span> in the terminal.</p>
</footer>
<script>
/*KONTEXT_SCRIPT*/
</script>
</body>
</html>
